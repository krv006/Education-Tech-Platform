services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edtech
      POSTGRES_USER: edtech
      POSTGRES_PASSWORD: edtech_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:latest
    # --node-ip: Docker Desktop'da konteyner ichki IP o'rniga host'dan ko'rinadigan manzilni e'lon qilish
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    ports:
      - "7880:7880"   # WebSocket / HTTP
      - "7881:7881"   # TCP fallback
      - "50000-50100:50000-50100/udp"  # WebRTC media
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      - redis

  # Dars video yozuvi (dev) — prod bilan bir xil, faqat named volume o'rniga
  # ./recordings ga bog'langan: backend Docker'siz (runserver) ishlagani uchun
  # RECORDINGS_DIR (default BASE_DIR/recordings) shu papkani bevosita o'qiydi.
  egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: devsecret_change_me_32chars_min!
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        logging:
          level: info
    volumes:
      - ./recordings:/out
    shm_size: 1gb  # Chrome asosidagi kompozitor uchun
    depends_on:
      - redis
      - livekit

volumes:
  pgdata:
