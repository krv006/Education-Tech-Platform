# Production — edu.thesofmebel.uz
# Ishga tushirish (serverda):
#   cp .env.prod.example .env   # va qiymatlarni to'ldiring
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edtech}
      POSTGRES_USER: ${POSTGRES_USER:-edtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da berilishi shart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edtech} -d ${POSTGRES_DB:-edtech}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # Format muhim: "kalit: sekret" (ikki nuqtadan keyin probel)
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
    ports:
      - "7881:7881"                    # WebRTC TCP fallback
      - "50000-50100:50000-50100/udp"  # WebRTC media
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn root.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-edu.thesofmebel.uz}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
    depends_on:
      - backend
      - livekit

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
