# Production — edu.thesofmebel.uz
# Ishga tushirish (serverda):
#   cp .env.prod.example .env   # va qiymatlarni to'ldiring
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edtech}
      POSTGRES_USER: ${POSTGRES_USER:-edtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da berilishi shart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edtech} -d ${POSTGRES_DB:-edtech}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # RAM chegarasi — channels/cache kalitlari TTL'li, volatile-ttl xavfsiz
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-ttl

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # Format muhim: "kalit: sekret" (ikki nuqtadan keyin probel)
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
    ports:
      - "7881:7881"                    # WebRTC TCP fallback
      - "50000-50100:50000-50100/udp"  # WebRTC media
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  # Dars video yozuvi (EduTech.docx) — xonani MP4 ga yozadi, fayl recordings
  # volume'iga tushadi, backend uni faqat auth stream orqali beradi
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?}
        api_secret: ${LIVEKIT_API_SECRET:?}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        logging:
          level: info
    volumes:
      - recordings:/out
    # Chrome asosidagi kompozitor uchun katta /dev/shm kerak
    shm_size: 1gb
    # Egress eng "och" konteyner — chegara qo'yamiz, API/darslarga
    # CPU yetmay qolmasin (yozuv sekinlashsa ham dars sekinlashmaydi)
    cpus: 2
    mem_limit: 2g
    depends_on:
      - redis
      - livekit

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_ENV: prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      RECORDINGS_DIR: /app/recordings
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn root.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - media:/app/media
      - logs:/app/logs   # log fayllar konteyner qayta yaratilsa ham saqlanadi
      - recordings:/app/recordings   # egress yozgan videolar (faqat auth stream)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    # Frontend alohida loyihaga ko'chirildi — Caddy endi faqat TLS + API proxy
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-edu.thesofmebel.uz}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
    networks:
      - default
      - navigo   # Navigo CRM nginx'iga proxy uchun (Caddyfile'dagi navigocrm bloki)
      - eslatbot # Eslat bot adminkasiga proxy uchun (Caddyfile'dagi eslat bloki)
    depends_on:
      - backend
      - livekit

volumes:
  pgdata:
  media:
  logs:
  recordings:
  caddy_data:
  caddy_config:

networks:
  # Boshqa loyihalarning tarmoqlari — shu serverda allaqachon mavjud.
  # Yangi serverda bo'lmasa: `docker network create <nom>` yoki shu bo'limlar +
  # caddy'dagi `networks:` yozuvlarini olib tashlang.
  navigo:
    external: true
  eslatbot:
    name: eslat_bot_default
    external: true
